<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive Settings -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>Praveen Kumar | Professional Portfolio</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Explore Gurram Praveen Kumar's professional portfolio, pharmacy background, clinical research skills, pharmacovigilance knowledge, and projects."
    />

    <meta name="author" content="Gurram Praveen Kumar" />

    <!-- Open Graph Metadata: LinkedIn, WhatsApp, Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Gurram Praveen Kumar | Professional Portfolio"
    />

    <meta
      property="og:description"
      content="Explore my professional portfolio, pharmacy background, clinical research skills, pharmacovigilance knowledge, and projects."
    />

    <meta
      property="og:url"
      content="https://gurram-praveen-kumar-portfolio.vercel.app/"
    />

    <!-- Portfolio Preview Image -->
    <meta
      property="og:image"
      content="https://gurram-praveen-kumar-portfolio.vercel.app/assets/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://gurram-praveen-kumar-portfolio.vercel.app/assets/og-image.png"
    />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Gurram Praveen Kumar | Professional Portfolio"
    />

    <meta
      name="twitter:description"
      content="My professional portfolio featuring pharmacy, clinical research, pharmacovigilance, skills, and projects."
    />

    <meta
      name="twitter:image"
      content="https://gurram-praveen-kumar-portfolio.vercel.app/assets/og-image.png"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Website Icon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

  </head>

  <body>
    <div id="root"></div>

    <!-- React Application -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
